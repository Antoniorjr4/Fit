name: FitLambda
options:
  developmentLanguage: en
  bundleIdPrefix: com.annalabs
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  FitLambda:
    type: application
    platform: iOS
    sources:
      - FitLambda
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.annalabs.fitlambda
        PRODUCT_NAME: FitLambda
        INFOPLIST_KEY_CFBundleDisplayName: FitΛ
        GENERATE_INFOPLIST_FILE: YES
        # Merged with the generated keys; holds the Bluetooth background mode.
        INFOPLIST_FILE: Config/FitLambda-Info.plist
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "FitLambda uses Bluetooth to find your Galaxy Fit3 and read its data."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.7.1"
        CURRENT_PROJECT_VERSION: "10"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      gatherCoverageData: false
      testTargets:
        - FitLambdaUITests
  FitLambdaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - FitLambdaUITests
    dependencies:
      - target: FitLambda
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.annalabs.fitlambda.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
