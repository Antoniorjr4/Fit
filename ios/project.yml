name: FitLambda
options:
  bundleIdPrefix: com.annalabs
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  FitLambda:
    type: application
    platform: iOS
    sources:
      - FitLambda
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.annalabs.fitlambda
        PRODUCT_NAME: FitLambda
        INFOPLIST_KEY_CFBundleDisplayName: FitΛ
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      gatherCoverageData: false
